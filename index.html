<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>개 고양이 판별기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg class="deco-star" style="top:120px; left:6%;" width="24" height="24" viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z" fill="#FF9EC4" /></svg>
  <svg class="deco-star" style="top:230px; right:8%;" width="16" height="16" viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z" fill="#FFC97A" /></svg>

  <header class="nav">
    <div class="brand">PAW / ID</div>
    <div class="nav-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7A4A16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z" /></svg>
      AI가 바로 확인해드려요
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <h1>이 아이는<br />개일까, 고양이일까?</h1>
        <p class="sub">사진 한 장만 올려주면 우리가 뚝딱 알려드릴게요. 복잡한 가입도, 서버 업로드도 필요 없어요!</p>
      </div>

      <div class="hero-upload">
        <label class="drop-zone" id="dropZone">
          <input type="file" id="fileInput" accept="image/*" hidden />
          <div class="drop-empty" id="dropText">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4M12 4l-4 4M12 4l4 4" />
              <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" />
            </svg>
            <span>이미지를 선택하거나<br />여기로 드래그하세요</span>
          </div>
          <img id="preview" hidden />
        </label>
      </div>
    </section>

    <div class="cta-row">
      <button id="classifyBtn" disabled>판별하기</button>
      <p id="status" class="status"></p>
    </div>

    <section id="result" class="result" hidden>
      <div class="result-icon">
        <svg width="34" height="34" viewBox="0 0 150 150">
          <ellipse cx="75" cy="90" rx="42" ry="38" fill="none" stroke="#E5601F" stroke-width="7" />
          <ellipse cx="42" cy="55" rx="16" ry="24" fill="none" stroke="#E5601F" stroke-width="7" transform="rotate(-25 42 55)" />
          <ellipse cx="108" cy="55" rx="16" ry="24" fill="none" stroke="#E5601F" stroke-width="7" transform="rotate(25 108 55)" />
        </svg>
      </div>
      <p id="resultLabel" class="result-label"></p>
      <p class="result-breed">
        <span id="resultBreed"></span> · 확신도 <span id="resultConfidence"></span>
      </p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.20.0/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
